<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b09">
  <title>الصفحة غير موجودة — Kick TV</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/icon.svg">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .notfound-card { max-width: 34rem; text-align: center; }
    .notfound-code { font-family: var(--font-display); font-size: 6rem; font-weight: 900; color: var(--green); line-height: 1; }
    .notfound-card p { margin: 1rem 0 1.6rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-card">
      <div class="notfound-code">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>الرابط الذي فتحته غير معروف. عُد إلى واجهة Kick TV واختر قناة من القائمة.</p>
      <a class="btn btn-primary" href="./">العودة إلى Kick TV</a>
    </div>
  </main>
</body>
</html>
